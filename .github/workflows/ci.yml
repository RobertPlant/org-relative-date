name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 27.1 is the floor declared in Package-Requires.
        emacs_version: ['27.1', '28.2', '29.4', '30.1']

    steps:
      - uses: actions/checkout@v7

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Show versions
        run: |
          emacs --version
          emacs -Q --batch --eval '(princ (format "org %s\n" (org-release)))'

      - name: Byte-compile (warnings are errors)
        run: make compile

      - name: Checkdoc
        run: make checkdoc

      - name: ERT
        run: make test

  # Advisory only: Emacs snapshot breaks for reasons that are not this
  # package's fault, so this job is deliberately left out of the branch's
  # required status checks.  It is NOT marked continue-on-error, because that
  # reports the job as successful even when its steps fail - a green tick that
  # means nothing.  Better to let it go visibly red and simply not block on it.
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: purcell/setup-emacs@v8.0
        with:
          version: snapshot

      - name: Show versions
        run: |
          emacs --version
          emacs -Q --batch --eval '(princ (format "org %s\n" (org-release)))'

      - name: Byte-compile (warnings are errors)
        run: make compile

      - name: Checkdoc
        run: make checkdoc

      - name: ERT
        run: make test

  package-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: purcell/setup-emacs@v8.0
        with:
          version: '30.1'

      - name: Run package-lint
        run: |
          emacs -Q --batch \
            --eval "(progn
                      (require 'package)
                      (setq package-user-dir (expand-file-name \".pkg\" default-directory))
                      (add-to-list 'package-archives
                                   '(\"melpa\" . \"https://melpa.org/packages/\") t)
                      (package-initialize)
                      (package-refresh-contents)
                      (package-install 'package-lint)
                      (require 'package-lint))" \
            -f package-lint-batch-and-exit org-relative-date.el
